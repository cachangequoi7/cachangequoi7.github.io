<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion TikTok</title>
<style>body{margin:0;background:#0b0d12;color:#e8e8ea;font:17px/1.6 system-ui,sans-serif}main{max-width:640px;margin:0 auto;padding:48px 16px}h1{color:#ffb020}
textarea{width:100%;box-sizing:border-box;height:120px;background:#151a24;color:#e8e8ea;border:1px solid #2a3142;border-radius:8px;padding:10px;font:14px monospace}
button{margin-top:12px;background:#ffb020;color:#0b0d12;border:0;border-radius:8px;padding:12px 20px;font-weight:700;font-size:16px;cursor:pointer}</style></head>
<body><main>
<h1>Presque fini</h1>
<p>Copie l'adresse ci-dessous, puis colle-la dans PowerShell, là où le script te la demande.</p>
<textarea id="u" readonly></textarea>
<button id="b">Copier l'adresse</button>
<p id="ok"></p>
<script>
const u=document.getElementById('u');u.value=location.href;
document.getElementById('b').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);document.getElementById('ok').textContent='Copié ✔';}catch(e){u.select();document.execCommand('copy');document.getElementById('ok').textContent='Copié ✔';}};
</script>
</main></body></html>
